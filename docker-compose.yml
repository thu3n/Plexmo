
version: '3'
services:
  plexmo:
    image: ghcr.io/thu3n/plexmo:latest
    container_name: plexmo
    environment:
      - TZ=Europe/Stockholm
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      # Tautulli DB import: copy a checkpointed snapshot of tautulli.db into
      # ./config/import/Tautulli/ on the host. Imports only read from inside
      # the config volume, so no extra mount is needed.
    restart: unless-stopped
